name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests || true
      - name: Mypy (strict)
        run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,net,api]"
      - name: Pytest
        env:
          # Deterministic provider/plugin discovery so a runner with unrelated
          # packages installed cannot change the result.
          ATHENEUM_NO_PLUGINS: "1"
        run: pytest tests -q
      - name: Run examples
        env:
          ATHENEUM_NO_PLUGINS: "1"
        run: |
          python examples/quickstart.py
          python examples/custom_tool_and_provider.py
      - name: Retrieval evaluation
        run: python -m atheneum.evaluate --json

  package:
    runs-on: ubuntu-latest
    needs: [lint-and-type, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify the wheel installs and imports
        run: |
          python -m pip install dist/*.whl
          python -c "import atheneum; print('import ok', atheneum.__version__)"
          ath --help >/dev/null && echo "cli ok"
